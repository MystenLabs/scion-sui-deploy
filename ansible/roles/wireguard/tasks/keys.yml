---
- name: Generate WireGuard private key if none is provided
  ansible.builtin.command: wg genkey
  register: wireguard_private_key_generation
  when: wireguard_private_key == ""
  tags: setup
  
- name: Register WireGuard private key as a fact
  set_fact:
    generated_wireguard_private_key: "{{ wireguard_private_key_generation.stdout }}"
  when: wireguard_private_key == ""
  tags: setup

- name: Generate WireGuard public key
  ansible.builtin.shell: |
    private_key="{{ generated_wireguard_private_key | default(wireguard_private_key) }}"
    echo -n "$private_key" | wg pubkey
  register: wireguard_public_key_generation
  tags: setup

- name: Register WireGuard public key as a fact
  set_fact:
    generated_wireguard_public_key: "{{ wireguard_public_key_generation.stdout }}"
  when: wireguard_public_key == ""
  tags: setup

- name: Debug generated keys
  debug:
    msg: 
      - "Private key: {{ generated_wireguard_private_key }}"
      - "Public key: {{ generated_wireguard_public_key }}"
  tags: setup

- name: Ensure WireGuard keys directory exists
  ansible.builtin.file:
    path: "{{ wireguard_config_path }}"
    state: directory
    mode: '0700'
  tags: setup

- name: Save WireGuard private key to file
  ansible.builtin.copy:
    content: "{{ generated_wireguard_private_key | default(wireguard_private_key) }}"
    dest: "{{ wireguard_config_path }}/{{ wireguard_interface }}.key"
    owner: root
    group: root
    mode: '0600'
  tags: setup
  become: true
  when: generated_wireguard_private_key is defined or wireguard_private_key != ""

- name: Save WireGuard public key to file
  ansible.builtin.copy:
    content: "{{ generated_wireguard_public_key | default(wireguard_public_key) }}"
    dest: "{{ wireguard_config_path }}/{{ wireguard_interface }}.pub"
    owner: root
    group: root
    mode: '0644'  # Public key can have more relaxed permissions
  tags: setup
  become: true
  when: generated_wireguard_public_key is defined or wireguard_public_key != ""